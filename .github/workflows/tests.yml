name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    # Pinned on purpose: `ubuntu-latest` moved to Ubuntu 26.04, where
    # actions/setup-python ships no prebuilt interpreter for older versions, so
    # the job failed before a single test ran.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # No phone needed: tests/fake_adb.py answers the commands the tools issue.
      - name: Run the test suite
        run: python -m unittest discover -s tests -v

      - name: Validate the safety databases
        run: python tools/plan.py --validate
