name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # No phone needed: tests/fake_adb.py answers the commands the tools issue.
      - name: Run the test suite
        run: python -m unittest discover -s tests -v

      - name: Validate the safety databases
        run: python tools/plan.py --validate
